name: CI - Lint, Test & Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run backend tests
        working-directory: gestion-solicitudes
        run: mvn -B test

      - name: Build backend
        working-directory: gestion-solicitudes
        run: mvn -B clean package -DskipTests

  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_avanzada/package-lock.json

      - name: Install dependencies
        working-directory: frontend_avanzada
        run: npm ci

      - name: Build frontend
        working-directory: frontend_avanzada
        run: npm run build

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gestion-solicitudes/Dockerfile
          push: false

      - name: Validate frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend_avanzada/Dockerfile
          push: false