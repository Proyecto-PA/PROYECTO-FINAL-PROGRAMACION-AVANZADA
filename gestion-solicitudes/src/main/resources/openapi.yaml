openapi: 3.0.3
info:
  title: Sistema de Triage y Gestión de Solicitudes Académicas
  description: |
    Contratos de la API REST del sistema de gestión de solicitudes académicas
    para el Programa de Ingeniería de Sistemas y Computación.

    La máquina de estados completa está definida en la extensión `x-maquina-estados`
    al final de este documento.
    La integración con IA es opcional; el sistema funciona sin ella (RF-11).
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo — Proyecto Avanzada

servers:
  - url: http://localhost:8080/api
    description: Servidor local de desarrollo

tags:
  - name: Solicitudes
    description: Registro, consulta y cierre de solicitudes académicas
  - name: Estado
    description: Transiciones en el ciclo de vida de la solicitud
  - name: Responsables
    description: Asignación de responsables
  - name: Historial
    description: Consulta del historial auditable de una solicitud
  - name: IA
    description: Funcionalidades opcionales asistidas por IA
  - name: Auth
    description: Registro e inicio de sesión de usuarios

paths:

  /auth/registro:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      description: |
        Crea un nuevo usuario en el sistem y devuelve un token JWT.
        Este enpoint es público, no requiere autenticación.
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
              example:
                nombre: "Estudiante Ejemplo"
                email: "estudiante@uniquindio.edu"
                password: "123456"
                rol: ESTUDIANTE
      responses:
        '201':
          description: Usuario creado correctamente, token generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existen un usuario con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Autentica un usuario con email y contraseña.
        Devuelve un token JWT para usar en los demás endpoints
        como Bearer Token en el header Authorization.
      operationId: loginUsuario
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "estudiante@uniquindio.edu"
              password: "123456"
      responses:
        '200':
          description: Login exitoso, token generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /solicitudes:
    post:
      tags: [Solicitudes]
      summary: Registrar nueva solicitud
      description: |
        Crea una solicitud académica en el sistema (RF-01). El estado inicial
        es REGISTRADA y se genera la primera entrada en el historial automáticamente.
        El ESTUDIANTE puede registrar solicitudes académicas.
      operationId: registrarSolicitud
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
            example:
              tipo: REGISTRO_ASIGNATURAS
              descripcion: "Solicito registro en Arquitectura Empresarial, tengo aprobados todos los prerrequisitos según mi historia académica."
              canalOrigen: CSU
              fechaLimite: "2026-03-15T23:59:59"
              impactoAcademico: 4
              solicitanteId: 1
      responses:
        '201':
          description: Solicitud creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags: [Solicitudes]
      summary: Listar solicitudes con filtros
      description: |
        Devuelve una lista paginada de solicitudes (RF-07). Los estudiantes solo
        ven sus propias solicitudes; docentes y administrativos ven todas.
      operationId: consultarSolicitudes
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
          description: Filtrar por estado actual
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoSolicitud'
          description: Filtrar por tipo de solicitud
        - name: prioridad
          in: query
          schema:
            $ref: '#/components/schemas/Prioridad'
          description: Filtrar por nivel de prioridad
        - name: responsableId
          in: query
          schema:
            type: integer
            format: int64
          description: ID del responsable asignado
        - name: solicitanteId
          in: query
          schema:
            type: integer
            format: int64
          description: ID del usuario que originó la solicitud
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Página a consultar (base 0)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
          description: Cantidad de resultados por página
      responses:
        '200':
          description: Listado paginado de solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /solicitudes/{id}:
    get:
      tags: [Solicitudes]
      summary: Obtener detalle de una solicitud
      description: Retorna toda la información de una solicitud específica (RF-07).
      operationId: obtenerSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /solicitudes/{id}/clasificar:
    put:
      tags: [Solicitudes]
      summary: Clasificar solicitud
      description: |
        Asigna el tipo definitivo a la solicitud (RF-02). Solo es válido si la
        solicitud está en REGISTRADA. Ver transición T1 en `x-maquina-estados`.
        Roles: ADMINISTRATIVO.
      operationId: clasificarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasificarRequest'
            example:
              tipo: HOMOLOGACION
      responses:
        '200':
          description: Solicitud clasificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/priorizar:
    put:
      tags: [Solicitudes]
      summary: Calcular y asignar prioridad
      description: |
        Ejecuta el motor de reglas sobre la solicitud para calcular su prioridad (RF-03).
        Toma en cuenta el tipo, el impacto académico y la fecha límite.
        La solicitud debe estar en CLASIFICADA.
        Roles: ADMINISTRATIVO.
      operationId: priorizarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Prioridad calculada y asignada a la solicitud (incluye justificacionPrioridad)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/iniciar-atencion:
    put:
      tags: [Estado]
      summary:  Iniciar atención de la solicitud
      description: |
        Transición de CLASIFICADA -> EN_ATENCION.
        El backend define el estado, no el cliente.
        Roles: DOCENTE, ADMINISTRATIVO.
      operationId: iniciarAtencion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                observacion:
                  type: string
                  maxLength: 500
                  example: "Se inicia revisión por parte del área académica."
      responses:
        '200':
          description: Solicitud en atención
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
  
  /solicitudes/{id}/marcar-atendida:
    put:
      tags: [Estado]
      summary: Marcar solicitud como atendida
      description: |
        Transición de EN_ATENCION -> ATENTIDA.
        Roles: DOCENTE, ADMINISTRATIVO.
      operationId:  marcarAtendida
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: false
        content: 
          application/json:
            schema:
              type: object
              properties: 
                observacion:
                  type: string
                  maxLength: 500
                  example: "Se completó el trámite exitosamente."
      responses:
        '200':
          description:  Solicitud marcada como atendida
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/SolicitudResponse'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/cerrar:
    put:
      tags: [Solicitudes]
      summary:  Cerrar solicitud
      description:  |
        Transición de ATENDIDA -> CERRADA.
        Finaliza el ciclo de vida de la solicitud.
        Requiere una observación obligatoria.
        Una vez cerrada, la solicitud no puede modificarse.
        Roles: DOCENTE, ADMINISTRATIVO.
      operationId: cerrarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:  [observacion]
              properties:
                observacion:
                  type: string
                  minLength: 10
                  maxLength: 1000
                  example: "Solicitud resuelta exitosamente. Se realizó el registro académico."
      responses:
        '200':
          description: Solicitud cerrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La solicitud no está en estado ATENDIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /solicitudes/{id}/cancelar:
    put:
      tags: [Solicitudes]
      summary: Cancelar solicitud
      description: |
        Cancelación lógica (no elimina el registro).
        Transición de REGISTRADA -> CANCELADA.
        Roles: ESTUDIANTE, ADMINISTRATIVO
      operationId: cancelarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observacion]
              properties:
                observacion:
                  type: string
                  minLength: 5
                  example: "Cancelada por error en la solicitud."
      responses:
        '200':
          description: Solicitud cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/responsable:
    put:
      tags: [Responsables]
      summary: Asignar responsable a la solicitud
      description: |
        Vincula un usuario responsable a la solicitud (RF-05). El usuario
        debe tener activo = true; si no lo está se rechaza con 422.
        El cambio queda registrado en el historial.
        Solo disponible para el rol ADMINISTRATIVO.
      operationId: asignarResponsable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarResponsableRequest'
            example:
              responsableId: 5
              observacion: "Asignada al coordinador del área de registro."
      responses:
        '200':
          description: Responsable asignado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: El usuario indicado no está activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-03-01T10:00:00"
                status: 422
                error: "Unprocessable Entity"
                mensaje: "No se puede asignar al usuario 5 porque su cuenta está inactiva."
                path: "/api/solicitudes/1/responsable"

  /solicitudes/{id}/historial:
    get:
      tags: [Historial]
      summary: Consultar historial de la solicitud
      description: |
        Devuelve todas las entradas del historial en orden cronológico (RF-06).
        Cada entrada refleja una acción con fecha exacta y usuario responsable.
      operationId: consultarHistorial
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Historial de acciones de la solicitud
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialSolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /solicitudes/{id}/sugerencia-ia:
    get:
      tags: [IA]
      summary: Pedir sugerencia al asistente de IA
      description: |
        Consulta el AsistenteIA para obtener sugerencia de clasificación, prioridad
        y/o resumen del historial (RF-09, RF-10). Si la IA no está disponible
        responde 503 pero el sistema sigue operando normalmente (RF-11).
        La sugerencia siempre requiere confirmación humana antes de aplicarse.
      operationId: obtenerSugerenciaIA
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Sugerencia generada por el modelo de lenguaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaIAResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Servicio de IA temporalmente no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-03-01T10:00:00"
                status: 503
                error: "Service Unavailable"
                mensaje: "El asistente de IA no responde en este momento. Puede continuar operando sin él."
                path: "/api/solicitudes/1/sugerencia-ia"

  /solicitudes/{id}/sugerencia-ia/confirmar:
    put:
      tags: [IA]
      summary: Confirmar o descartar sugerencia de IA
      description: |
        Permite al usuario revisar la sugerencia y decidir si la aplica (con o
        sin ajustes) o la descarta (RF-10). Si aplicar es false la solicitud
        no se modifica.
      operationId: confirmarSugerenciaIA
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSugerenciaRequest'
            example:
              aplicar: true
              tipoAjustado: HOMOLOGACION
              prioridadAjustada: ALTA
      responses:
        '200':
          description: Decisión registrada y aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /historial/{solicitudId}:
    get:
      tags: [Historial]
      summary: Consultar historial de una solicitud
      description: |
        Devuelve todas las acciones registradas sobre una solicitud
        ordenadas cronológicamente de más antigua a más reciente (RF-06).
        Cualquier usuario autenticado puede consultar el historial.
      operationId: consultarHistorial
      security:
        - bearerAuth: []
      parameters:
        - name: solicitudId
          in: path
          required: true
          description: ID  de la solicitud académica
          schema:
            type:  integer
            format: int64
            example: 1
      responses:
        '200':
          description: Historial encontrado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialSolicitudResponse'
                example:
                  - id: 1
                    fechaAccion: "2026-03-01T09:00:00"
                    accionRealizada: "Solicitud registrada en el sistema"
                    usuarioResponsable:
                      id: 3
                      nombre: "Estudiante Ejemplo"
                      email: "estudiante@uniquindio.edu"
                      rol: ESTUDIANTE
                    observaciones: null
                    estadoAnterior: null
                    estadoNuevo: REGISTRADA
                  - id: 2
                    fechaAccion: "2026-03-01T10:30:00"
                    accionRealizada: "Cambio de estado: REGISTRADA a CLASIFICADA"
                    usuarioResponnsable:
                      id: 2
                      nombre: "Docente Ejemplo"
                      email: "docente@uniquindio.edu"
                      rol: DOCENTE
                    observaciones: "Clasificada como HOMOLOGACION"
                    estadoAnterior: REGISTRADA
                    estadoNuevo: CLASIFICADA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido al autenticarse en el sistema

  parameters:
    SolicitudId:
      name: id
      in: path
      required: true
      description: ID de la solicitud académica
      schema:
        type: integer
        format: int64
        example: 1

  responses:
    BadRequest:
      description: Algún campo requerido está ausente o tiene un valor inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-01T10:00:00"
            status: 400
            error: "Bad Request"
            mensaje: "El campo 'descripcion' es requerido y no puede estar vacío."
            path: "/api/solicitudes"

    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación (RF-13)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-01T10:00:00"
            status: 403
            error: "Forbidden"
            mensaje: "El rol ESTUDIANTE no puede clasificar solicitudes."
            path: "/api/solicitudes/1/clasificar"

    NotFound:
      description: No se encontró la solicitud con el ID indicado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-01T10:00:00"
            status: 404
            error: "Not Found"
            mensaje: "No existe una solicitud con id 99."
            path: "/api/solicitudes/99"

    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TransicionInvalida:
      description: La transición de estado solicitada no está permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-01T10:00:00"
            status: 409
            error: "Conflict"
            mensaje: "No es posible pasar de EN_ATENCION a REGISTRADA."
            path: "/api/solicitudes/1/estado"

    UnprocessableEntity:
      description: Los datos son válidos pero violan una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: No autenticado. Se requiere un token JWT válido en el header Authorization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-01T09:00:00"
            status: 401
            error: "Unauthorized"
            mensaje: "Token JWT ausente o inválido."
            path: "/api/solicitudes"

  schemas:

    TipoSolicitud:
      type: string
      description: Categoría de la solicitud académica (RF-02)
      enum:
        - REGISTRO_ASIGNATURAS
        - HOMOLOGACION
        - CANCELACION_ASIGNATURAS
        - SOLICITUD_CUPOS
        - CONSULTA_ACADEMICA
        - OTRO

    CanalOrigen:
      type: string
      description: Canal por el que ingresó la solicitud al sistema (RF-01)
      enum:
        - CSU
        - CORREO
        - SAC
        - TELEFONO
        - PRESENCIAL

    EstadoSolicitud:
      type: string
      description: Estado actual de la solicitud. Ver flujo completo en x-maquina-estados.
      enum:
        - REGISTRADA
        - CLASIFICADA
        - EN_ATENCION
        - ATENDIDA
        - CERRADA
        - CANCELADA

    Prioridad:
      type: string
      description: Nivel de prioridad asignado por el motor de reglas (RF-03)
      enum:
        - CRITICA
        - ALTA
        - MEDIA
        - BAJA

    RolUsuario:
      type: string
      description: Rol del usuario dentro del sistema (RF-13)
      enum:
        - ESTUDIANTE
        - DOCENTE
        - ADMINISTRATIVO

    # Requests
    RegistroRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          example: "Estidaonte Ejemplo"
        email:
          type: string
          format: email
          example: "estudiante@uniquindio.edu"
        password:
          type: string
          minLength: 6
          example: "123456"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "estudiante@uniquindio.edu"
        password:
          type: string
          example: "123456"

    SolicitudRequest:
      type: object
      description: Cuerpo para registrar una nueva solicitud académica
      required:
        - tipo
        - descripcion
        - canalOrigen
        - solicitanteId
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
          description: Explicación detallada de lo que necesita el solicitante
          minLength: 10
          maxLength: 1000
          example: "Requiero homologación de la materia Cálculo II cursada en otra universidad."
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        fechaLimite:
          type: string
          format: date-time
          nullable: true
          description: Si la solicitud tiene fecha límite, se usa para calcular la prioridad
          example: "2026-03-15T23:59:59"
        solicitanteId:
          type: integer
          format: int64
          description: ID del usuario que hace la solicitud
          example: 1

    ClasificarRequest:
      type: object
      description: Indica el tipo al que pertenece la solicitud
      required:
        - tipo
        - impactoAcademico
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        impactoAcademico:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de impacto académico evaluado por el docente (1=bajo, 5=alto)
          example: 4
        observacion:
          type: string
          nullable: true

    CambiarEstadoRequest:
      type: object
      description: Nuevo estado al que se quiere llevar la solicitud
      required:
        - nuevoEstado
      properties:
        nuevoEstado:
          $ref: '#/components/schemas/EstadoSolicitud'
        observacion:
          type: string
          maxLength: 500
          nullable: true
          description: Comentario opcional sobre el motivo del cambio

    AsignarResponsableRequest:
      type: object
      description: Datos para vincular un responsable a la solicitud
      required:
        - responsableId
      properties:
        responsableId:
          type: integer
          format: int64
          description: ID del usuario que se va a encargar de la solicitud
          example: 5
        observacion:
          type: string
          maxLength: 500
          nullable: true
          description: Nota opcional sobre la asignación

    CerrarSolicitudRequest:
      type: object
      description: Datos para el cierre definitivo de la solicitud
      required:
        - observacion
      properties:
        observacion:
          type: string
          minLength: 10
          maxLength: 1000
          description: Descripción del resultado o resolución (obligatorio)
          example: "Se aprobó la homologación. Materia registrada en el historial académico del estudiante."

    ConfirmarSugerenciaRequest:
      type: object
      description: Respuesta del usuario a la sugerencia de la IA
      required:
        - aplicar
      properties:
        aplicar:
          type: boolean
          description: true para aplicar la sugerencia, false para descartarla
        tipoAjustado:
          $ref: '#/components/schemas/TipoSolicitud'
          nullable: true
          description: Tipo corregido por el usuario si difiere de la sugerencia
        prioridadAjustada:
          $ref: '#/components/schemas/Prioridad'
          nullable: true
          description: Prioridad corregida por el usuario si difiere de la sugerencia

    # Responses
    AuthResponse:
      type: object
      description: Respuesta de autenticación conn token JWT
      properties:
        token:
          type: string
          description: Token JWT para usar como Bearer en Authorization
          example: "bcfubSUE8agde5..."
        usuarioId:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Estudiante Ejemplo"
        email:
          type: string
          example: "estudiante@uniquindio.edu"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    UsuarioResumen:
      type: object
      description: Datos básicos de un usuario incluidos en las respuestas
      properties:
        id:
          type: integer
          format: int64
          example: 3
        nombre:
          type: string
          example: "Carlos Ramírez"
        email:
          type: string
          format: email
          example: "c.ramirez@universidad.edu.co"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    SolicitudResponse:
      type: object
      description: Representación completa de una solicitud académica
      properties:
        id:
          type: integer
          format: int64
          example: 7
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
          example: "Solicito homologación de Cálculo II."
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        fechaRegistro:
          type: string
          format: date-time
          example: "2026-03-01T08:30:00"
        fechaLimite:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-15T23:59:59"
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
          nullable: true
        justificacionPrioridad:
          type: string
          nullable: true
          description: Texto generado por el motor de reglas explicando el nivel asignado
          example: "Prioridad ALTA: homologación con fecha límite en 14 días e impacto 4/5."
        impactoAcademico:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        responsable:
          $ref: '#/components/schemas/UsuarioResumen'
          nullable: true

    SolicitudPageResponse:
      type: object
      description: Wrapper de paginación para listados de solicitudes
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudResponse'
        paginaActual:
          type: integer
          example: 0
        totalPaginas:
          type: integer
          example: 5
        totalElementos:
          type: integer
          format: int64
          example: 87

    HistorialSolicitudResponse:
      type: object
      description: Registro de una acción realizada sobre la solicitud (RF-06)
      properties:
        id:
          type: integer
          format: int64
          example: 10
        fechaAccion:
          type: string
          format: date-time
          example: "2026-03-01T09:15:00"
        accionRealizada:
          type: string
          description: Descripción de lo que ocurrió en este punto del historial
          example: "Cambio de estado: REGISTRADA → CLASIFICADA"
        usuarioResponsable:
          $ref: '#/components/schemas/UsuarioResumen'
        observaciones:
          type: string
          nullable: true
          example: "Clasificada como HOMOLOGACION por el coordinador del programa."
        estadoAnterior:
          $ref: '#/components/schemas/EstadoSolicitud'
          nullable: true
        estadoNuevo:
          $ref: '#/components/schemas/EstadoSolicitud'
          nullable: true

    ResultadoPrioridadResponse:
      type: object
      description: Salida del motor de reglas de priorización (RF-03)
      properties:
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        justificacion:
          type: string
          description: Explicación del porqué de la prioridad asignada
          example: "CRITICA: homologación con fecha límite en 3 días e impacto académico máximo."
        reglaAplicada:
          type: string
          description: Nombre de la regla que tuvo mayor peso en la decisión
          example: "ReglaFechaLimiteCritica"
        fechaEvaluacion:
          type: string
          format: date-time
          example: "2026-03-01T09:20:00"

    SugerenciaIAResponse:
      type: object
      description: Sugerencia generada por el AsistenteIA (RF-09, RF-10)
      properties:
        tipoSugerido:
          $ref: '#/components/schemas/TipoSolicitud'
        prioridadSugerida:
          $ref: '#/components/schemas/Prioridad'
        resumen:
          type: string
          description: Resumen del estado e historial generado por el modelo de lenguaje
          example: "Solicitud de homologación ingresada el 01/03 por estudiante de 6to semestre. Sin responsable asignado hace 2 días."
        confirmada:
          type: boolean
          description: Indica si el usuario ya revisó y confirmó esta sugerencia
          example: false
        fechaSugerencia:
          type: string
          format: date-time
          example: "2026-03-01T09:25:00"

    ErrorResponse:
      type: object
      description: Formato estándar para todas las respuestas de error
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        mensaje:
          type: string
          description: Descripción del error con contexto útil para el desarrollador
          example: "No existe una solicitud con id 99."
        path:
          type: string
          description: Endpoint donde ocurrió el error
          example: "/api/solicitudes/99"


x-maquina-estados:
  entidad: SolicitudAcademica
  descripcion: >
    Una solicitud académica pasa por varios estados a lo largo de su ciclo de vida.
    El flujo es siempre hacia adelante: no se puede retroceder ni saltar estados.
    Existen dos estados terminales: CERRADA (flujo completo) y CANCELADA (cancelación temprana).
    Una vez en estado termianl, la solicitud no puede modificarse.

  estado_inicial: REGISTRADA
  estado_terminal: [CERRADA, CANCELADA]

  diagrama: |
    REGISTRADA → CLASIFICADA → EN_ATENCION → ATENDIDA → CERRADA
         │
          -------------→ CANCELADA

  estados:

    REGISTRADA:
      descripcion: >
        La solicitud acaba de ingresar al sistema. Todavía no fue revisada
        ni categorizada por nadie. Es el punto de partida de cualquier trámite.
      es_terminal: false

    CLASIFICADA:
      descripcion: >
        La solicitud fue revisada y categorizada. A partir de aquí 
        calcular la prioridad y asignar responsables.
      es_terminal: false

    EN_ATENCION:
      descripcion: >
        Un responsable está trabajando activamente en el trámite. Indica que
        la solicitud no está olvidada sino en proceso.
      es_terminal: false

    ATENDIDA:
      descripcion: >
        El trámite fue resuelto. Desde este estado solo queda formalizarlo con
        un cierre, para lo cual se exige dejar una observación del resultado.
      es_terminal: false

    CERRADA:
      descripcion: >
        Estado final. La solicitud quedó cerrada con su observación de resultado
        y ya no puede tocarse bajo ningún concepto.
      es_terminal: true

    CANCELADA:
      descripcion: >
        Estado terminal alternativo. La solicitud fue cancelada por el usuario antes
        de iniciar su procesamiento. No se elimina del sistema.
      es_terminakl: true

  transiciones:
    -
    - id: T0
      desde: REGISTRADA
      hacia: CANCELADA
      descripcion: Cancelación lógica de la solicitud
      endpoint: PUT /api/solicitudes/{id}/cancelar
      quien_puede:  [ESTUDIANTE, ADMINISTRATIVO]
      condiciones:
        - La solicitud debe estar en REGISTRADA

    - id: T1
      desde: REGISTRADA
      hacia: CLASIFICADA
      descripcion: Se revisa la solicitud y se le asigna un tipo
      endpoint: PUT /api/solicitudes/{id}/clasificar
      quien_puede: [ADMINISTRATIVO]
      condiciones:
        - La solicitud debe estar en REGISTRADA

    - id: T2
      desde: CLASIFICADA
      hacia: EN_ATENCION
      descripcion: Se da inicio formal a la atención del trámite
      endpoint: PUT /api/solicitudes/{id}/iniciar-atencion
      quien_puede: [DOCENTE, ADMINISTRATIVO]
      condiciones:
        - La solicitud debe estar en CLASIFICADA

    - id: T3
      desde: EN_ATENCION
      hacia: ATENDIDA
      descripcion: El responsable indica que ya resolvió la solicitud
      endpoint: PUT /api/solicitudes/{id}/marcar_atendida
      quien_puede: [DOCENTE, ADMINISTRATIVO]
      condiciones:
        - La solicitud debe estar en EN_ATENCION

    - id: T4
      desde: ATENDIDA
      hacia: CERRADA
      descripcion: Cierre formal del trámite con registro del resultado
      endpoint: PUT /api/solicitudes/{id}/cerrar
      quien_puede: [DOCENTE, ADMINISTRATIVO]
      condiciones:
        - La solicitud debe estar en ATENDIDA
        - La observación de cierre es obligatoria (mínimo 10 caracteres)

  transiciones_invalidas:
    descripcion: >
      El ValidadorTransicionEstado bloquea cualquier movimiento que no esté
      en la lista de arriba. Algunos ejemplos de lo que no está permitido:

    ejemplos:
      - caso: intentar reabrir una solicitud cerrada
        desde: CERRADA
        hacia: cualquier estado

      - caso: intentar modificar una solicitud cancelada
        desde: CANCELADA
        hacia: cualquier estado

      - caso: retroceder en el flujo
        desde: EN_ATENCION
        hacia: REGISTRADA

      - caso: saltar estados intermedios
        desde: REGISTRADA
        hacia: ATENDIDA