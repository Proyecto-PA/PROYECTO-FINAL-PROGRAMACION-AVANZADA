openapi: 3.0.3
info:
  title: Sistema de Triage y Gestión de Solicitudes Académicas
  description: |
    Contratos de la API REST del sistema de gestión de solicitudes académicas
    para el Programa de Ingeniería de Sistemas y Computación.

    La máquina de estados completa está definida en la extensión `x-maquina-estados`
    al final de este documento.
    La integración con IA es opcional; el sistema funciona sin ella (RF-11).
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo — Proyecto Avanzada

servers:
  - url: http://localhost:8080/api
    description: Servidor local de desarrollo

tags:
  - name: Auth
    description: Registro e inicio de sesión de usuarios
  - name: Solicitudes
    description: Registro, consulta y gestión del ciclo de vida de solicitudes
  - name: Estado
    description: Transiciones de estado dentro del ciclo de vida
  - name: Responsables
    description: Asignación de responsables a solicitudes
  - name: Historial
    description: Consuta del historial auditable de una solicitud
  - name: IA
    description: Funcionalidades opcionales asistidas por inteligencia artificiall

paths:

# --------- AUTH --------------------------------------------------------------------------------------------------------------------
  /auth/registro:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      description: |
        Crea un nuevo usuario en el sistema y devuelve un token JWT listo para usar.
        Este endpoint es público y no requiere autenticación. Si el email ya existe se 
        retorna '409 Conflict'.
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
              example:
                nombre: "Ana García"
                email: "ana.garcia@uniquindio.edu"
                password: "123456"
                rol: ESTUDIANTE
      responses:
        '201':
          description: Usuario creado correctamente - token JWT incluido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existen un usuario registrado con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-04-05T10:00:00"
                status: 409
                error: "Conflict"
                mensaje: "Ya existe un usuario con el email ana.garcia@uniquindio.edu"
                path: "/api/auth/registro"

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Autentica al usuario con email y contraseña.
        Devuelve un token JWT para incluir como 'Bearer <token>
        en el header 'Authorization' de los demás endpoints.
        Este endpoint es público.
      operationId: loginUsuario
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "ana.garcia@uniquindio.edu"
              password: "123456"
      responses:
        '200':
          description: Login exitoso - token JWT incluido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-04-05T10:00:00"
                status: 401
                error: "Unauthorized"
                mensaje: "Credenciales inválidas"
                path: "/apii/auth/login"
        '404':
          description: No existe ningún usuario con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-04-05T10:00:00"
                status: 404
                error: "Not Found"
                mensaje: "Credenciales Inválidas"
                path: "/api/auth/login"


# --- SOLICITUDES -----------------------------------------------------------------------------------------------------------------

  /solicitudes:
    post:
      tags: [Solicitudes]
      summary: Registrar nueva solicitud (RF-01)
      description: |
        Crea una solicitud académica. El estado inicial es 'REGISTRADA' y
        se genera automáticamente la primera entrada en el historial.
        El 'solicitanteId' se extrae del token JWT - No se envia en el body
      operationId: registrarSolicitud
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
            example:
              tipo: HOMOLOGACION
              descripcion: "Solicito homologación de Calculo II cursada en la Universidad Nacional con nota de 4.2."
              canalOrigen: CSU
              fechaLimite: "2026-05-15T23:59:59"
      responses:
        '201':
          description: Solicitud creada correctamente con estado REGISTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Solicitudes]
      summary: Listar solicitudes con filtros (RF-07)
      description: |
        Devuelve una lista paginada de solicitudes con filtros opcionales Los estudiantes solo
        ven sus propias solicitudes; docentes y administrativos ven todas.
      operationId: consultarSolicitudes
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          description: Filtrar por estado actual
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
        - name: tipo
          in: query
          description: Filtrar por tipo de solicitud
          schema:
            $ref: '#/components/schemas/TipoSolicitud'
        - name: prioridad
          in: query
          description: Filtrar por nivel de prioridad
          schema:
            $ref: '#/components/schemas/Prioridad'
        - name: responsableId
          in: query
          description: ID del usuario responsable asignado
          schema:
            type: integer
            format: int64
        - name: solicitanteId
          in: query
          description: ID del usuario que realizó la solicitud
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          description: Página a consultar (base 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Cantidad de resultados por página
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Listado paginado de solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /solicitudes/{id}:
    get:
      tags: [Solicitudes]
      summary: Obtener detalle de una solicitud (RF-07)
      description: |
        Retorna la representación completa de una solicitud por su ID
      operationId: obtenerSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /solicitudes/{id}/clasificar:
    put:
      tags: [Solicitudes]
      summary: Clasificar solicitud (RF-02)
      description: |
        Asigna el tipo definitivo e impacto académico a la solicitud.
        Realiza la transición de estado 'REGISTRADA -> CLASIFICADA' (T1).
        
        El impacto académico (1-5) es evaluado por el administrativo con 
        criterio técnico, ya que influye directamente en el motor de prioridad-
        
        **Roles:** 'ADMINISTRATIVO' únicamente.
      operationId: clasificarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasificarRequest'
            example:
              tipo: HOMOLOGACION
              impactoAcademico: 4
              observacion: "Revisada la documentación. Confirmada como homologación."
      responses:
        '200':
          description: Solicitud clasificada - estado actualizado a CLASIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/priorizar:
    put:
      tags: [Solicitudes]
      summary: Calcular y asignar prioridad automática (RF-03)
      description: |
        Ejecuta el motor de reglas sobre la solicitud para determinar su prioridad.
        Toma en cuenta el tipo, el impacto académico y la fecha límite.
        La solicitud debe estar en CLASIFICADA.
        
        El motor pondera cuatro reglas con distintos pesos:
        Fecha límite (4)
        Impacto académico (3)
        Tipo de solicitud (2)
        Canal de origen (1)
        
        El resultado incluye la 'justificacionPrioridad' con detalle de cada regla aplicada.
        
        **Roles:** 'ADMINISTRATIVO' únicamente.
      operationId: priorizarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Prioridad calculada y asignada a la solicitud (incluye justificacionPrioridad)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La solicitud no estpa en estado CLASIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                example:
                  timestamp: "2026-04-05T10:00:00"
                  status: 409
                  error: "Conflict"
                  mensaje: "Solo se puede priorizar una solicitud en estado CLASIFICADA. Estado actual: REGISTRADA"
                  path: "/api/solicitudes/1/priorizar"

  /solicitudes/{id}/responsable:
    put:
      tags: [Responsables]
      summary: Asignar responsable (RF-05)
      description: |
        Vincula un docente o usuario responsable a la solicitud.
        El usuario debe tener 'activo= true'; de lo contrario se rechaza con '409'.
        El cambio queda registrado en el historial con la acción 'RESPONSABLE_ASIGNADO'.
        
        **Roles:** 'ADMINISTRATIVO' únicamente
      operationId: asignarResponsable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarResponsableRequest'
            example:
              responsableId: 2
              observacion: "Asignado al coordinador del área de registro académico."
      responses:
        '200':
          description: Responsable asignado corrrectamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El usario indicado no está activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-04-05T10:00:00"
                status: 409
                error: "Conflict"
                mensaje: "El usuario con id 2 no está activo"
                path: "/api/solicitudes/1/responsable"

  /solicitudes/{id}/iniciar-atencion:
    put:
      tags: [Estado]
      summary:  Iniciar atención de la solicitud (T2)
      description: |
        Transición de CLASIFICADA -> EN_ATENCION.
        Infica que un reponsable comenzó a trabar activamente en el trámite
        La observación es opcional
        
        **Roles:** 'DOCENTE', 'ADMINISTRATIVO'
      operationId: iniciarAtencion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
            example:
              observacion: "Se inicia revisión de la documentación adjunta."
      responses:
        '200':
          description: Solicitud en atención - estado EN_ATENCION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  
  /solicitudes/{id}/marcar-atendida:
    put:
      tags: [Estado]
      summary: Marcar solicitud como atendida
      description: |
        Transición EN_ATENCION -> ATENTIDA.
        El responsable indica que resolvió el trámite.
        
        **Roles:** 'DOCENTE', 'ADMINISTRATIVO'
      operationId:  marcarAtendida
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: false
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
            example:
              observacion: "Trámite resuelto exitosamente."
      responses:
        '200':
          description:  Solicitud marcada como atendida - estado ATENDIDA
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/cerrar:
    put:
      tags: [Estado]
      summary:  Cerrar solicitud (T4)
      description:  |
        Transición de ATENDIDA -> CERRADA. Cierre formal del trámite.
        La observacion es obligatoria. Una vez cerrada la soliicitud no puede modificarse.
        
        **Roles:** 'DOCENTE', 'ADMINISTRATIVO'
      operationId: cerrarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarSolicitudRequest'
            example:
              observacion: "Homologación aprobada y registrada en el sistema académico."
      responses:
        '200':
          description: Solicitud cerrada - estado CERRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

  /solicitudes/{id}/cancelar:
    put:
      tags: [Estado]
      summary: Cancelar solicitud (T0)
      description: |
        Cancelación lógica (no elimina el registro). Transición REGISTRADA -> CANCELADA.
      operationId: cancelarSolicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
            example: 
              observacion: "Cancelada por error en la descripción."
      responses:
        '200':
          description: Solicitud cancelada - estado CANCELADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': 
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransicionInvalida'

# --- HISTORIAL ------------------------------------------------------------------------------------------------------------------
  
  /solicitudes/{solicitudId}:
    get:
      tags: [Historial]
      summary: Consultar historial de una solicitud (RF-06)
      description: |
        Devuelve todas las entradas de auditoría de la solicitud en orden cronológico
        ascendente. La primera entrada siempre corresponde al registro incial con 
        'estadoAnterior: null' y estadoNuevo: REGISTRADA'.
        
      operationId: consultarHistorial
      security:
        - bearerAuth: []
      parameters:
        - name: solicitudId
          in: path
          required: true
          description: ID de la solicitud académica
          schema: 
            type: integer
            format: int64
            example: 1
      responses: 
        '200':
          description: Historial encontrado
          content: 
            application/json:
              schema: 
                type: array
                items: 
                  $ref: '#/components/schemas/HistorialSolicitudResponse'
                example: 
                  - id: 1
                    fechaAccion: "2026-04-05T09:00:00"
                    accionRealizada: "Solicitud registrada en el sistema"
                    usuarioResponsable:
                      id: 1
                      nombre: "Ana García"
                      email: "ana.garcia@uniquindio.edu"
                      rol: ESTUDIANTE
                    observaciones: null
                    estadoAnterior: null
                    estadoNuevo: REGISTRADA
                  - id: 2
                    fechaAccion: "2026-04-05T10:30:00"
                    accionRealizada: "Cambio de estado: REGISTRADA -> CLASIFICADA"
                    usuarioResponsable:
                      id: 3
                      nombre: "María López"
                      email: "maria.lopez@uniquindio.edu"
                      rol: ADMINISTRATIVO
                    observaciones: "Clasificada como HOMOLOGACION con impacto académico 4"
                    estadoAnterior: REGISTRADA
                    estadoNuevo: CLASIFICADA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  # --- IA -------------------------------------------------------------------------------------------------------------------------------
  
  /solicitudes/{id}/sugerencia-ia:
    get:
      tags: [IA]
      summary: Obtener sugerencia del asistete IA (RF-09)
      description: |
        Consulta el AsistenteIA (Groq/LLaMA) para obtener sugerencias de clasificación, prioridad y un
        resumen del caso.
        Si la IA no está disponible retorna un '503' y el sistema sigue operando con normalidad. (rf-11)
        La sugerencia siempre requiere confirmación humana antes de aplicarse.
        
      operationId: obtenerSugerenciaIA
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Sugerencia generada - confirmada siempre en false hasta que el usuario la acepte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaIAResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Servicio de IA no disponible - el sistema sigue operando
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-04-05T10:00:00"
                status: 503
                error: "Service Unavailable"
                mensaje: "El asistente de IA no responde en este momento. Puede continuar operando sin él."
                path: "/api/solicitudes/1/sugerencia-ia"

  /solicitudes/{id}/sugerencia-ia/confirmar:
    put:
      tags: [IA]
      summary: Confirmar o descartar sugerencia de IA (RF-10)
      description: |
        El usuario decide si aplica la sugerencia (con o sin ajustes) o la descarta. 
        
      operationId: confirmarSugerenciaIA
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSugerenciaRequest'
            example:
              aplicar: 
                summary: Aplicarr sugerencia con ajuste manual
                value: 
                  aplicar: true
                  tipoAjustado: HOMOLOGACION
                  prioridadAjustada: ALTA
                descartar:
                  summary: Descartar sugerencia
                  value: 
                    aplicar: false
      responses:
        '200':
          description: Decisión registrada - solicitud actualizada 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# --- COMPONENTES ----------------------------------------------------------------------------------------------------------
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido al autenticarse. Enviar como 'Bearer <token>' en el header 'Authorization'.

  parameters:
    SolicitudId:
      name: id
      in: path
      required: true
      description: ID de la solicitud académica
      schema:
        type: integer
        format: int64
        example: 1
        
   # --- RESPONSES ---------------------------------------------------------------------------------------------------------
    
  responses:
    
    BadRequest:
      description: Algún campo obligatorio está ausente o tiene un valor inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-04-05T10:00:00"
            status: 400
            error: "Bad Request"
            mensaje: "tipo: El tipo de solicitud es obligatorio, impactoAcademico: El impacto académico
            es obligatorio"
            path: "/api/solicitudes/1/clasificar"
   
    Unauthorized:
      description: Token JWT ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-04-05T09:00:00"
            status: 401
            error: "Unauthorized"
            mensaje: "Token JWT ausente o inválido."
            path: "/api/solicitudes"
            
    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación 
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-04-05T10:00:00"
            status: 403
            error: "Forbidden"
            mensaje: "No tienes permisos para realizar esta acción."
            path: "/api/solicitudes/1/clasificar"

    NotFound:
      description: No se encontró el recurso solicitado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-04-05T10:00:00"
            status: 404
            error: "Not Found"
            mensaje: "No existe una solicitud con id 99."
            path: "/api/solicitudes/99"
            
    TransicionInvalida:
      description: La transición de estado solicitada no está permitida por la máquina de estados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-04-05T10:00:00"
            status: 409
            error: "Conflict"
            mensaje: "No es posible pasar de EN_ATENCION a REGISTRADA. Transición no permitida"
            path: "/api/solicitudes/1/clasificar"

# --- SCHEMAS ---------------------------------------------------------------------------------------------------------------------
  schemas:
    
    # Enums
    TipoSolicitud:
      type: string
      description: Categoría de la solicitud académica (RF-02)
      enum:
        - REGISTRO_ASIGNATURAS
        - HOMOLOGACION
        - CANCELACION_ASIGNATURAS
        - SOLICITUD_CUPOS
        - CONSULTA_ACADEMICA
        - OTRO

    CanalOrigen:
      type: string
      description: Canal por el que ingresó la solicitud al sistema (RF-01)
      enum:
        - CSU
        - CORREO
        - SAC
        - TELEFONO
        - PRESENCIAL

    EstadoSolicitud:
      type: string
      description: |
        Estado actual de la solicitud dentro de su cilo de vida.
        - 'REGISTRADA' -> estado incial
        - 'CLASIFICADA' -> tipo e impacto asignados por el administrativo
        - 'EN_ATENCION' -> el responsable comenzó a trabajar en la solicituf
        - 'ATENDIDA' -> trámite resuelto, pendiente de cierre formal
        - 'CERRADA' -> estado terminal - flujo completo
        - 'CANCELADA' -> estado terminal - cancelación temprana
      enum:
        - REGISTRADA
        - CLASIFICADA
        - EN_ATENCION
        - ATENDIDA
        - CERRADA
        - CANCELADA

    Prioridad:
      type: string
      description: Nivel de prioridad asignado por el motor de reglas (RF-03)
      enum:
        - CRITICA
        - ALTA
        - MEDIA
        - BAJA

    RolUsuario:
      type: string
      description: Rol del usuario dentro del sistema (RF-13)
      enum:
        - ESTUDIANTE
        - DOCENTE
        - ADMINISTRATIVO

    # Requests
    RegistroRequest:
      type: object
      description: Datos para registrar un nuevo usuario
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          example: "Ana García"
        email:
          type: string
          format: email
          example: "ana.garcia@uniquindio.edu"
        password:
          type: string
          minLength: 6
          example: "123456"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    LoginRequest:
      type: object
      description: Credenciales para inciar sesión
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "ana.garcia@uniquindio.edu"
        password:
          type: string
          example: "123456"

    SolicitudRequest:
      type: object
      description: |
        Datos para registrar una nueva solicitud académica.
        El 'impactoAcademico' no se inlcuye aquí, lo asigna el administrativo al clasificar.
      required: [tipo, descripcion, canaOrigen]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
          description: Explicación detallada de lo que necesita el solicitante
          minLength: 10
          maxLength: 1000
          example: "Solicito homologación de Cálculo II cursada en otra universidad."
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        fechaLimite:
          type: string
          format: date-time
          nullable: true
          description: Fecha límite para resolver la solicitud. Influye en el cálculo de la prioridad.
          example: "2026-05-15T23:59:59"
        solicitanteId:
          type: integer
          format: int64
          description: ID del usuario que hace la solicitud
          example: 1

    ClasificarRequest:
      type: object
      description: |
        Datos para clasificar la solicitud. El administrativo asigna el tipo definitivo y evalúa 
        el impacto académico (1-5) con criterio técnico.
      required: [tipo, impactoAcademico]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        impactoAcademico:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            Nivel de impacto académico evaluado por el administrativo.
            - 1: Consulta informativa sin consecuencias
            - 3: Impacto moderado en el semestre
            - 5: Compromete la continuidad académica del estudiante
          example: 4
        observacion:
          type: string
          maxLength: 500
          nullable: true
          example: "Confirmada como homologación según documentación adjunta."

    CambiarEstadoRequest:
      type: object
      description: Observación opcional para transiciones de estado
      properties:
        observacion:
          type: string
          maxLenght: 500
          nullable: true
          example: "Se incia revisión del expediente."
    
    CerrarSolicitudRequest:
      type: object
      description: Datos para el cierre definitivo de la solicitud
      required: [observacion]
      properties:
        observacion:
          type: string
          minLength: 10
          maxLength: 1000
          description: Descripción del resultado o resolución (obligatorio)
          example: " Homologación aprobada. Materia registrada en el sistema académico"

    AsignarResponsableRequest:
      type: object
      description: Datos para asignar un responsable a la solicitud
      required: [responsableId]
      properties:
        responsableId:
          type: integer
          format: int64
          description: ID del usuario que atenderá la solicitud
          example: 2
        observacion:
          type: string
          maxLength: 500
          nullable: true
          description: "Asignado al coordinador de registro académico"

    ConfirmarSugerenciaRequest:
      type: object
      description: Decisión del usuario sobre la sugerencia IA
      required: [aplicar]
      properties:
        aplicar:
          type: boolean
          description: "'true' aplica la sugerencia, 'false' la descarta sin modificar la solicitud"
        tipoAjustado:
          $ref: '#/components/schemas/TipoSolicitud'
          nullable: true
          description: Tipo corregido por el usuario si difiere de la sugerencia
        prioridadAjustada:
          $ref: '#/components/schemas/Prioridad'
          nullable: true
          description: Prioridad corregida por el usuario si difiere de la sugerencia

    # Responses
    AuthResponse:
      type: object
      description: Respuesta de autenticación con token JWT
      properties:
        token:
          type: string
          description: Token JWT para usar como Bearer en Authorization
          example: "bcfubSUE8agde5..."
        usuarioId:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Ana García"
        email:
          type: string
          example: "ana.garcia@uniquindio.edu"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    UsuarioResumenResponse:
      type: object
      description: Datos básicos de un usuario incluidos en las respuestas
      properties:
        id:
          type: integer
          format: int64
          example: 2
        nombre:
          type: string
          example: "Carlos Ramírez"
        email:
          type: string
          format: email
          example: "carlos.ramirez@uniquindio.edu"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    SolicitudResponse:
      type: object
      description: Representación completa de una solicitud académica
      properties:
        id:
          type: integer
          format: int64
          example: 1
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
          example: "Solicito homologación de Cálculo II."
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        fechaRegistro:
          type: string
          format: date-time
          example: "2026-04-05T08:30:00"
        fechaLimite:
          type: string
          format: date-time
          nullable: true
          example: "2026-05-15T23:59:59"
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
          nullable: true
          description: Null hasta que el administrativo ejecute /priorizar
        justificacionPrioridad:
          type: string
          nullable: true
          description: Texto generado por el motor de reglas explicando el nivel asignado
          example: "- Fecha límite en 40 día(s). -> MEDIA. - Impacto académico nivel 4/5 ->
          ALTA. Prioridad final calculada: ALTA"
        impactoAcademico:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Null hasta que el administrativo clasifique la solicitud
          example: 4
        solicitante:
          $ref: '#/components/schemas/UsuarioResumenResponse'
        responsable:
          $ref: '#/components/schemas/UsuarioResumenResponse'
          nullable: true
          description: Null hasta que el administrativo asigne un responsable

    SolicitudPageResponse:
      type: object
      description: Respuesta paginada de solicitudes
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudResponse'
        paginaActual:
          type: integer
          example: 0
        totalPaginas:
          type: integer
          example: 3
        totalElementos:
          type: integer
          format: int64
          example: 45

    HistorialSolicitudResponse:
      type: object
      description: Entrada del historial de auditoria de una solicitud(RF-06)
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fechaAccion:
          type: string
          format: date-time
          example: "2026-04-05T09:15:00"
        accionRealizada:
          type: string
          description: Descripción de lo que ocurrió en este punto del historial
          example: "Cambio de estado: REGISTRADA → CLASIFICADA"
        usuarioResponsable:
          $ref: '#/components/schemas/UsuarioResumenResponse'
        observaciones:
          type: string
          nullable: true
          example: "Clasificada como HOMOLOGACION con impacto académico 4."
        estadoAnterior:
          $ref: '#/components/schemas/EstadoSolicitud'
          nullable: true
          description: Null en la entrada de registro inicial
        estadoNuevo:
          $ref: '#/components/schemas/EstadoSolicitud'
          nullable: true

    SugerenciaIAResponse:
      type: object
      description: Sugerencia generada por el AsistenteIA (RF-09, RF-10)
      properties:
        tipoSugerido:
          type: string
          description: Tipo sugerido por la IA (valor del enum TipoSolicitud)
          example: "HOMOLOGACION"
        prioridadSugerida:
          type: string
          description: Prioridad sugerida por la IA (valor del enum Prioridad)
          example: "ALTA"
        resumen:
          type: string
          description: Resumen del caso generado por el modelo de lenguaje
          example: "Solicitud de homologación de asignatura cursada en otra institución. 
          Documentación adjunta. Requiere verificación con el departamento académico."
        confirmada:
          type: boolean
          description: Siempre 'false' al generarse - cambia a 'true' tras confirmar
          example: false
        fechaSugerencia:
          type: string
          format: date-time
          example: "2026-04-05T09:25:00"

    ErrorResponse:
      type: object
      description: Formato estándar de error para todas las respuestas de fallo
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-04-05T10:00:00"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        mensaje:
          type: string
          description: Descripción del error con contexto útil para el desarrollador
          example: "No existe una solicitud con id 99."
        path:
          type: string
          description: Endpoint donde ocurrió el error
          example: "/api/solicitudes/99"

# --- MÁQUINA DE ESTADOS ------------------------------------------------------------------------------------------------

x-maquina-estados:
  entidad: SolicitudAcademica
  descripcion: >
    Una solicitud académica pasa por varios estados a lo largo de su ciclo de vida.
    El flujo es siempre hacia adelante: no se puede retroceder ni saltar estados.
    Existen dos estados terminales: CERRADA (flujo completo) y CANCELADA (cancelación temprana).
    Una vez en estado termianl, la solicitud no puede modificarse.

  estado_inicial: REGISTRADA
  estado_terminal: [CERRADA, CANCELADA]

  diagrama: |
    REGISTRADA -> CLASIFICADA -> EN_ATENCION -> ATENDIDA -> CERRADA
         │
          -------------→ CANCELADA

  transiciones:
    -
    - id: T0
      desde: REGISTRADA
      hacia: CANCELADA
      descripcion: Cancelación lógica de la solicitud
      endpoint: PUT /api/solicitudes/{id}/cancelar
      quien_puede: [ ESTUDIANTE, ADMINISTRATIVO ]
      condiciones:
        - La solicitud debe estar en REGISTRADA

    - id: T1
      desde: REGISTRADA
      hacia: CLASIFICADA
      descripcion: Se revisa la solicitud y se le asigna un tipo
      endpoint: PUT /api/solicitudes/{id}/clasificar
      quien_puede: [ ADMINISTRATIVO ]
      condiciones:
        - La solicitud debe estar en REGISTRADA

    - id: T2
      desde: CLASIFICADA
      hacia: EN_ATENCION
      descripcion: Se da inicio formal a la atención del trámite
      endpoint: PUT /api/solicitudes/{id}/iniciar-atencion
      quien_puede: [ DOCENTE, ADMINISTRATIVO ]
      condiciones:
        - La solicitud debe estar en CLASIFICADA

    - id: T3
      desde: EN_ATENCION
      hacia: ATENDIDA
      descripcion: El responsable indica que ya resolvió la solicitud
      endpoint: PUT /api/solicitudes/{id}/marcar_atendida
      quien_puede: [ DOCENTE, ADMINISTRATIVO ]
      condiciones:
        - La solicitud debe estar en EN_ATENCION

    - id: T4
      desde: ATENDIDA
      hacia: CERRADA
      descripcion: Cierre formal del trámite con registro del resultado
      endpoint: PUT /api/solicitudes/{id}/cerrar
      quien_puede: [ DOCENTE, ADMINISTRATIVO ]
      condiciones:
        - La solicitud debe estar en ATENDIDA
        - La observación de cierre es obligatoria (mínimo 10 caracteres)

  transiciones_invalidas:
    descripcion: >
      El ValidadorTransicionEstado bloquea cualquier movimiento que no esté
      en la lista de arriba. Algunos ejemplos de lo que no está permitido:

    ejemplos:
      - caso: intentar reabrir una solicitud cerrada
        desde: CERRADA
        hacia: cualquier estado

      - caso: intentar modificar una solicitud cancelada
        desde: CANCELADA
        hacia: cualquier estado

      - caso: retroceder en el flujo
        desde: EN_ATENCION
        hacia: REGISTRADA

      - caso: saltar estados intermedios
        desde: REGISTRADA
        hacia: ATENDIDA

    REGISTRADA:
      descripcion: >
        La solicitud acaba de ingresar al sistema. Todavía no fue revisada
        ni categorizada por nadie. Es el punto de partida de cualquier trámite.
      es_terminal: false

    CLASIFICADA:
      descripcion: >
        La solicitud fue revisada y categorizada. A partir de aquí 
        calcular la prioridad y asignar responsables.
      es_terminal: false

    EN_ATENCION:
      descripcion: >
        Un responsable está trabajando activamente en el trámite. Indica que
        la solicitud no está olvidada sino en proceso.
      es_terminal: false

    ATENDIDA:
      descripcion: >
        El trámite fue resuelto. Desde este estado solo queda formalizarlo con
        un cierre, para lo cual se exige dejar una observación del resultado.
      es_terminal: false

    CERRADA:
      descripcion: >
        Estado final. La solicitud quedó cerrada con su observación de resultado
        y ya no puede tocarse bajo ningún concepto.
      es_terminal: true

    CANCELADA:
      descripcion: >
        Estado terminal alternativo. La solicitud fue cancelada por el usuario antes
        de iniciar su procesamiento. No se elimina del sistema.
      es_terminakl: true

    acciones_sin_transicion:
      - accion: Priorizar
        endpoint: "PUT /api/solicitudes/{id}/priorizar"
        quien_puede: [ ADMINISTRATIVO ]
        condicion: La solicitud debe estar en CLASIFICADA
        efecto: Asigna prioridad y justificacionPrioridad sin cambiar el estado

      - accion: Asignar responsable
        endpoint: "PUT /api/solicitudes/{id}/responsable"
        quien_puede: [ ADMINISTRATIVO ]
        condicion: El usuario responsable debe estar activo
        efecto: Vincula el responsable sin cambiar el estado
