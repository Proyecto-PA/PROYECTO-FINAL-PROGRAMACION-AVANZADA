spring.application.name=gestion-solicitudes

# Conexion con la BD MySQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.query.substitutions=true

# Contexto API
server.servlet.context-path=/api

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Configuracion de Asistente IA
ia.habilitada=true
ia.api.url=${IA_API_URL}
ia.api.key=${IA_API_KEY}
ia.api.model=llama-3.3-70b-versatile