<div class="layout-container">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-left">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="navbar-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span>Sistema de Solicitudes</span>
      </div>
    </div>
    
    <div class="navbar-right">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="badge" [ngClass]="getRolBadgeClass()">{{ userRol }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </nav>

  <div class="main-content">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="!isSidebarOpen">
      <nav class="sidebar-nav">
        @for (item of filteredMenuItems; track item.label) {
          <a 
            [routerLink]="item.route" 
            [queryParams]="item.queryParams"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: !item.queryParams }"
            class="sidebar-link">
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <!-- Content -->
    <main class="content" [class.sidebar-collapsed]="!isSidebarOpen">
      <ng-content></ng-content>
    </main>
  </div>
</div>
